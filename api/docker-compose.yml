services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chessnotes
    # Host port 5433 so it does not clash with a Postgres already running on 5432
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chessnotes"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
