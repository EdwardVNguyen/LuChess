# Tests every PR and every push to main. A push to main that passes them
# publishes both images, built for the Pi (arm64), to GHCR, tagged `latest`
# and the full commit SHA, so any commit can be deployed or rolled back to
# (docs/deploy.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Only what the tests need. The publishing job asks for packages: write itself.
permissions:
  contents: read

# A new push to a PR replaces its run. Runs on main all finish, so every
# commit that passes gets its images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-24.04
    # internal/testdb creates a database per test, so it connects as the
    # superuser to the server's default database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The version web/Dockerfile builds with.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    # Native arm64, so nothing is built under emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # VITE_API_URL is fixed into the bundle (README). Check it before
      # either image is pushed, so a main without it publishes neither.
      - name: Check VITE_API_URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the repository variable VITE_API_URL to the site's own origin, e.g. https://<the site>"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The source label links each GHCR package to this repository.
      - name: Build and push the API
        uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/edwardvnguyen/luchess-api:latest
            ghcr.io/edwardvnguyen/luchess-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the frontend
        uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ghcr.io/edwardvnguyen/luchess-web:latest
            ghcr.io/edwardvnguyen/luchess-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
